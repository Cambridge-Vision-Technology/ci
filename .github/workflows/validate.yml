on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run-org-read-probes:
        description: |
          Run the manual, read-only organization-read probes. Off by default so an
          ordinary manual dispatch costs nothing extra. Needs the CI_FETCH_APP_ID and
          CI_FETCH_APP_PRIVATE_KEY organization secrets and the self-hosted
          x86_64-linux runner.
        type: boolean
        default: false

# The runner reads FORCE_JAVASCRIPT_ACTIONS_TO_NODE24 while it prepares a
# JavaScript action, so only a workflow-level env takes effect; a job-level or
# step-level one is already too late. Without it
# actions/create-github-app-token does not run on [self-hosted, Linux, X64],
# which is the runner probe-auth-action-self-hosted-org-read uses. This is the
# same requirement the README documents for consumers (DEV-757).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lints:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: git checkout
        uses: actions/checkout@v4
      - uses: DeterminateSystems/determinate-nix-action@v3
      - uses: DeterminateSystems/flakehub-cache-action@main
      # actionlint lints workflow files only — composite action.yml has a
      # different schema (`runs.using: composite`) that actionlint rejects.
      # The composite is validated at runtime by the `setup-composite-smoke`
      # job + the structural assertions in tests/setup-action-structure/.
      - run: nix run nixpkgs#actionlint -- ./.github/workflows/workflow.yml ./.github/workflows/validate.yml
      - name: Run shell contract tests
        run: |
          set -euo pipefail
          failed=0
          if ! nix shell nixpkgs#yq-go --command tests/runner-map-transform/test.sh; then
            failed=1
          fi
          if ! nix shell nixpkgs#yq-go --command tests/setup-action-structure/test.sh; then
            failed=1
          fi
          if ! nix shell nixpkgs#yq-go --command tests/workflow-structure/test.sh; then
            failed=1
          fi
          exit "$failed"
      # NOTE: was `nixpkgs#nodePackages.prettier` until 2026-05; nixpkgs
      # unstable removed the `nodePackages` set so prettier moved to the
      # top level. Fixed as part of this PR because it blocks the lints
      # job on every run otherwise.
      - run: nix run nixpkgs#prettier -- --check .

  ci:
    uses: ./.github/workflows/workflow.yml
    permissions:
      contents: read
      id-token: write
    with:
      directory: ./tests/smoke
      # NOTE: This repo's own CI uses GitHub-hosted runners, not the org self-hosted defaults
      runner-map: '{"x86_64-linux": "ubuntu-latest", "aarch64-darwin": "macos-latest"}'

  # Smoke test for the setup composite when consumed STANDALONE (not via
  # workflow.yml). Validates that bespoke per-repo workflows can `uses:`
  # the composite directly — covers the use case the extraction was done
  # for. If this passes, downstream consumers (e.g. infra's
  # state-plan-on-pr.yml) get a working setup phase without copying
  # ~100 lines of inline shell.
  setup-composite-smoke:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./setup
        with:
          checkout: "false" # already checked out above
      - name: Verify authenticated git clone over HTTPS works
        run: |
          set -euo pipefail
          # Clone *this* repo — GITHUB_TOKEN is scoped to the workflow's own
          # repository, so cross-repo clones (even within the same org) fail
          # with "Repository not found". A self-clone exercises the netrc /
          # credential-helper paths set up by the composite without needing
          # additional permissions.
          tmp="$(mktemp -d)"
          git clone --depth 1 https://github.com/${{ github.repository }} "$tmp/self"
          test -f "$tmp/self/README.md"
      - name: Verify Nix is on PATH
        run: nix --version
      - name: Verify every credential file is job-scoped with mode 600
        run: |
          set -euo pipefail
          # `stat -f` means different things on BSD (format) vs GNU (filesystem
          # info) — `2>/dev/null || fallback` doesn't disambiguate because GNU
          # stat succeeds with -f and returns the wrong output. Branch on
          # $RUNNER_OS (always Linux / macOS / Windows under GHA) instead.
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            stat_cmd='stat -f %Lp'
          else
            stat_cmd='stat -c %a'
          fi
          for name in github-org-read-netrc github-org-read-credentials github-org-read-nix-conf; do
            file="$(find "$RUNNER_TEMP" -maxdepth 1 -name "$name.*" -print -quit)"
            test -n "$file" || { echo "no $name file under RUNNER_TEMP" >&2; exit 1; }
            perms=$($stat_cmd "$file")
            [[ "$perms" == "600" ]] || { echo "$file has perms $perms, expected 600" >&2; exit 1; }
          done
          # No token-bearing file is written into HOME, so nothing outlives the
          # job on a self-hosted runner, and no machine-owner state is replaced.
          test ! -L "$HOME/.netrc" || { echo "$HOME/.netrc was replaced with a symlink" >&2; exit 1; }
          test ! -e "$HOME/.git-credentials" || { echo "$HOME/.git-credentials was written" >&2; exit 1; }
          if [[ -f "$HOME/.config/nix/nix.conf" ]]; then
            ! grep -qE '^[[:space:]]*(extra-)?access-tokens|^[[:space:]]*netrc-file' "$HOME/.config/nix/nix.conf" ||
              { echo "$HOME/.config/nix/nix.conf carries job credential settings" >&2; exit 1; }
          fi
          # The exported NIX_USER_CONF_FILES has to take effect for a fresh nix
          # invocation, not just inside the step that wrote it.
          credential_file="$(find "$RUNNER_TEMP" -maxdepth 1 -name 'github-org-read-netrc.*' -print -quit)"
          nix config show | grep -qF "netrc-file = $credential_file"

  # === Manual organization-read probes ======================================
  #
  # These are read-only, manual-only probes for behaviour that needs real App
  # credentials and real private repositories. They are NOT part of ordinary
  # validation.
  #
  # Every probe is gated on BOTH `github.event_name == 'workflow_dispatch'` AND
  # the explicit `run-org-read-probes` opt-in. On a pull_request or a push the
  # first term is already false, and the `inputs` context does not exist there
  # either, so no probe job is ever created. On a plain manual dispatch the
  # opt-in defaults to false, so a dispatch has to ask for them by name. Normal
  # pull-request validation therefore keeps exercising the unchanged default
  # path with no App credentials.
  #
  # Each probe proves the same three things over HTTPS, with App credentials and
  # no SSH key whatsoever:
  #   * a private clone of infra-base,
  #   * resolution of private nix-shared through its git+ssh:// flake URL, which
  #     only succeeds when the insteadOf rewrite reaches Nix's flake fetcher,
  #   * a private Git-LFS-bearing input whose objects arrive smudged rather than
  #     as pointers.
  # purescript-dedup is the LFS repository used throughout: it is LFS-bearing
  # (71 tracked *.zstd fixtures, ~9 MB of objects) and small enough to finish
  # inside the probe budget, unlike oz (295 MB) or blackbriar (312 MB).
  #
  # Nothing here writes to any repository, and no step prints or uploads a
  # private key, an installation token, or a credential file.

  # Probe 1 — the reusable workflow, on a GitHub-hosted Linux runner.
  #
  # The proof lives in tests/org-read-probe/flake.nix rather than in steps,
  # because a job that calls a reusable workflow cannot add steps to it. That
  # flake's three inputs are the three things above, and `nix flake check`
  # cannot even evaluate without resolving them.
  #
  # The limits here are structural, not oversights. GitHub rejects `steps`,
  # `env` AND `timeout-minutes` on a job that calls a reusable workflow with
  # `uses:` — verified against actionlint — so this probe cannot clear the Nix
  # caches, cannot blank SSH_AUTH_SOCK / GIT_SSH_COMMAND to make SSH unusable,
  # cannot cap its own runtime, and cannot run the public-repository A/B check.
  #
  # What stands in for each: it runs on ubuntu-latest, a fresh virtual machine
  # that has never held a Nix cache and carries no SSH key and no agent, so the
  # cold cache and the absence of SSH are guaranteed by construction rather than
  # by a step; it inherits workflow.yml's build timeout; and workflow.yml's own
  # hard-coded 2.35.0 minimum-Nix guard fails the job outright below the floor,
  # which is the condition the A/B check would otherwise detect.
  #
  # The two probes that CAN run steps do clear both the gitv3 and the fetcher
  # cache and do make SSH unusable — including the self-hosted one, which is the
  # only runner with a persistent cache to go stale.
  probe-reusable-workflow-org-read:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run-org-read-probes }}
    uses: ./.github/workflows/workflow.yml
    permissions:
      contents: read
      id-token: write
    with:
      enable-org-read-access: true
      directory: ./tests/org-read-probe
      runner-map: '{"x86_64-linux": "ubuntu-latest"}'
      check-dev-shells: false
    secrets:
      github-app-id: ${{ secrets.CI_FETCH_APP_ID }}
      github-app-private-key: ${{ secrets.CI_FETCH_APP_PRIVATE_KEY }}

  # Probe 2 — the setup composite consumed standalone, on GitHub-hosted Linux.
  probe-setup-action-org-read:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run-org-read-probes }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      # No SSH path can be reached from this job: no agent socket is inherited,
      # and the ssh transport is a command that always fails. Anything that
      # succeeds below therefore succeeded over HTTPS with the App token, which
      # is the whole point — a passing git+ssh fetch would prove nothing.
      SSH_AUTH_SOCK: ""
      GIT_SSH_COMMAND: "false"
      PROBE_ORG: Cambridge-Vision-Technology
    steps:
      # First, before anything can fetch. A warm Nix git cache serves a private
      # tree that an earlier authenticated run put there and turns this whole
      # probe into a false green. That has happened in practice. The fetcher
      # cache is cleared too: it memoises fetchGit results by URL and revision,
      # so on its own it would short-circuit the fetches below just as happily.
      - name: Clear the Nix git and fetcher caches
        run: |
          set -euo pipefail
          rm -rf "$HOME/.cache/nix/gitv3"
          rm -rf "$HOME"/.cache/nix/fetcher-cache-v*

      - uses: actions/checkout@v4

      - uses: ./setup
        with:
          checkout: "false" # already checked out above
          enable-org-read-access: "true"
          github-app-id: ${{ secrets.CI_FETCH_APP_ID }}
          github-app-private-key: ${{ secrets.CI_FETCH_APP_PRIVATE_KEY }}

      # Runs after the setup composite because that is what installs Nix on a
      # GitHub-hosted runner. NIX_USER_CONF_FILES is dropped for this one
      # command so neither the netrc nor the access token can influence it.
      - name: Isolate the Nix Git-LFS endpoint bug with a credential-free public repository
        run: |
          set -euo pipefail
          # Apress/repo-with-large-file-storage is public, so no credential is
          # involved, and its URL deliberately carries no `.git` suffix, which is
          # exactly what triggers the malformed-endpoint defect.
          #
          # READ THE OUTCOMES CAREFULLY, because they are counter-intuitive:
          #   HTTP 403 "exceeded its LFS budget" is the SUCCESS signal. Only a
          #     real GitHub LFS API response can produce it, so endpoint
          #     discovery worked. This is what Nix >= 2.35.0 does.
          #   HTTP 422 is the FAILURE signal. Nix < 2.35.0 builds a malformed
          #     endpoint and GitHub rejects it before it evaluates any
          #     credential, so every private LFS result below would be
          #     meaningless.
          # Both are matched on the surrounding error phrase Nix prints, never
          # on a bare three-digit number. This log carries store paths and URLs,
          # and a store hash containing "403" with no "422" anywhere would
          # otherwise be read as a FALSE GREEN. A phrase that fails to match
          # falls through to the fail-closed branch at the end, which is a red.
          ab_log="$RUNNER_TEMP/public-lfs-ab.log"
          ab_status=0
          env -u NIX_USER_CONF_FILES nix eval --impure --raw \
            --extra-experimental-features "nix-command flakes" \
            --expr '(builtins.fetchGit { url = "https://github.com/Apress/repo-with-large-file-storage"; ref = "master"; lfs = true; }).outPath' \
            > "$ab_log" 2>&1 || ab_status=$?
          sed -E 's/(gh[psu]_|github_pat_)[A-Za-z0-9_]+/[redacted]/g' "$ab_log"
          if [ "$ab_status" -eq 0 ]; then
            echo "The public Git-LFS fetch succeeded outright, so endpoint discovery works on this Nix."
            exit 0
          fi
          if grep -qE 'HTTP error 422' "$ab_log"; then
            echo "::error::HTTP 422 from the public Git-LFS endpoint: this Nix builds a malformed endpoint and is below 2.35.0. Treat every private Git-LFS result in this run as meaningless."
            exit 1
          fi
          if grep -qE 'HTTP error 403|exceeded its LFS budget' "$ab_log"; then
            echo "HTTP 403 (LFS budget exceeded) is the expected SUCCESS signal: a real GitHub LFS API response proves endpoint discovery worked."
            exit 0
          fi
          echo "::error::The public Git-LFS A/B check produced neither a 'HTTP error 403' / 'exceeded its LFS budget' success phrase nor a 'HTTP error 422' failure phrase, so it cannot isolate the endpoint defect from authentication."
          exit 1

      - name: Verify no SSH credential is available to this probe
        run: |
          set -euo pipefail
          test -z "${SSH_AUTH_SOCK:-}"
          test "$GIT_SSH_COMMAND" = "false"
          test ! -e "$HOME/.ssh/id_rsa"
          test ! -e "$HOME/.ssh/id_ed25519"
          echo "No agent socket and no usable ssh transport: every fetch below has to go over HTTPS with the App token."

      - name: Clone private infra-base over HTTPS with App credentials only
        run: |
          set -euo pipefail
          clone_dir="$RUNNER_TEMP/probe-infra-base"
          rm -rf "$clone_dir"
          git clone --depth 1 "https://github.com/$PROBE_ORG/infra-base" "$clone_dir"
          test -f "$clone_dir/flake.nix"
          rm -rf "$clone_dir"
          echo "Private infra-base cloned over HTTPS."

      - name: Resolve private nix-shared through its git+ssh flake URL
        run: |
          set -euo pipefail
          # Nix strips the git+ prefix and hands git a plain
          # ssh://git@github.com/… URL, which is the one load-bearing insteadOf
          # form. With no SSH key in the job, resolving this at all proves the
          # rewrite reaches Nix's flake fetcher.
          metadata="$RUNNER_TEMP/probe-nix-shared-metadata.json"
          nix flake metadata --json \
            --extra-experimental-features "nix-command flakes" \
            "git+ssh://git@github.com/$PROBE_ORG/nix-shared" > "$metadata"
          grep -q '"revision"' "$metadata"
          rm -f "$metadata"
          echo "Private nix-shared resolved through its git+ssh:// flake URL."

      - name: Fetch a private Git-LFS-bearing input over the token path
        run: |
          set -euo pipefail
          # Nix implements the Git-LFS protocol itself, so the credential helper
          # and http.extraHeader do not reach it. It reads the remote through
          # libgit2, which applies insteadOf, so this fetch takes the HTTPS
          # branch and authenticates from netrc-file.
          store_path="$(nix eval --impure --raw \
            --extra-experimental-features "nix-command flakes" \
            --expr '(builtins.fetchGit { url = "ssh://git@github.com/'"$PROBE_ORG"'/purescript-dedup"; ref = "main"; lfs = true; }).outPath')"
          listing="$RUNNER_TEMP/probe-lfs-files.txt"
          find "$store_path" -type f -name '*.zstd' | sort > "$listing"
          test -s "$listing"
          lfs_file="$(head -n 1 "$listing")"
          header="$RUNNER_TEMP/probe-lfs-header"
          head -c 100 "$lfs_file" > "$header"
          if grep -q 'git-lfs.github.com/spec/v1' "$header"; then
            echo "::error::$lfs_file is an unsmudged Git-LFS pointer, so the LFS objects were never fetched."
            rm -f "$listing" "$header"
            exit 1
          fi
          rm -f "$listing" "$header"
          echo "Private Git-LFS objects fetched and smudged over the token path."

  # Probe 3 — the standalone auth action on the self-hosted x86_64-linux runner
  # (dell-foo, Nix 2.35.1), deliberately WITHOUT the setup composite. This is
  # the DEV-757 build_workstation_index shape: a job that manages its own
  # checkout and already has Nix, and wants credentials only.
  #
  # actions/create-github-app-token is a JavaScript action and will not run on
  # [self-hosted, Linux, X64] unless FORCE_JAVASCRIPT_ACTIONS_TO_NODE24 is set
  # at workflow level, which it is at the top of this file.
  probe-auth-action-self-hosted-org-read:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run-org-read-probes }}
    runs-on: x86_64-linux
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      SSH_AUTH_SOCK: ""
      GIT_SSH_COMMAND: "false"
      PROBE_ORG: Cambridge-Vision-Technology
    steps:
      # This is the runner the cold cache actually matters on: it is persistent,
      # so an earlier authenticated run leaves both the git cache and the
      # fetcher cache warm, and every fetch below would be served from disk.
      - name: Clear the Nix git and fetcher caches
        run: |
          set -euo pipefail
          rm -rf "$HOME/.cache/nix/gitv3"
          rm -rf "$HOME"/.cache/nix/fetcher-cache-v*

      - uses: actions/checkout@v4

      # Unlike the setup-composite probe, this runner already has Nix, so the
      # credential-free A/B check runs BEFORE any credential exists at all.
      - name: Isolate the Nix Git-LFS endpoint bug with a credential-free public repository
        run: |
          set -euo pipefail
          # Apress/repo-with-large-file-storage is public, so no credential is
          # involved, and its URL deliberately carries no `.git` suffix, which is
          # exactly what triggers the malformed-endpoint defect.
          #
          # READ THE OUTCOMES CAREFULLY, because they are counter-intuitive:
          #   HTTP 403 "exceeded its LFS budget" is the SUCCESS signal. Only a
          #     real GitHub LFS API response can produce it, so endpoint
          #     discovery worked. This is what Nix >= 2.35.0 does.
          #   HTTP 422 is the FAILURE signal. Nix < 2.35.0 builds a malformed
          #     endpoint and GitHub rejects it before it evaluates any
          #     credential, so every private LFS result below would be
          #     meaningless.
          # Both are matched on the surrounding error phrase Nix prints, never
          # on a bare three-digit number. This log carries store paths and URLs,
          # and a store hash containing "403" with no "422" anywhere would
          # otherwise be read as a FALSE GREEN. A phrase that fails to match
          # falls through to the fail-closed branch at the end, which is a red.
          ab_log="$RUNNER_TEMP/public-lfs-ab.log"
          ab_status=0
          env -u NIX_USER_CONF_FILES nix eval --impure --raw \
            --extra-experimental-features "nix-command flakes" \
            --expr '(builtins.fetchGit { url = "https://github.com/Apress/repo-with-large-file-storage"; ref = "master"; lfs = true; }).outPath' \
            > "$ab_log" 2>&1 || ab_status=$?
          sed -E 's/(gh[psu]_|github_pat_)[A-Za-z0-9_]+/[redacted]/g' "$ab_log"
          if [ "$ab_status" -eq 0 ]; then
            echo "The public Git-LFS fetch succeeded outright, so endpoint discovery works on this Nix."
            exit 0
          fi
          if grep -qE 'HTTP error 422' "$ab_log"; then
            echo "::error::HTTP 422 from the public Git-LFS endpoint: this Nix builds a malformed endpoint and is below 2.35.0. Treat every private Git-LFS result in this run as meaningless."
            exit 1
          fi
          if grep -qE 'HTTP error 403|exceeded its LFS budget' "$ab_log"; then
            echo "HTTP 403 (LFS budget exceeded) is the expected SUCCESS signal: a real GitHub LFS API response proves endpoint discovery worked."
            exit 0
          fi
          echo "::error::The public Git-LFS A/B check produced neither a 'HTTP error 403' / 'exceeded its LFS budget' success phrase nor a 'HTTP error 422' failure phrase, so it cannot isolate the endpoint defect from authentication."
          exit 1

      - uses: ./auth
        with:
          enable-org-read-access: "true"
          github-app-id: ${{ secrets.CI_FETCH_APP_ID }}
          github-app-private-key: ${{ secrets.CI_FETCH_APP_PRIVATE_KEY }}

      - name: Verify no SSH credential is available to this probe
        run: |
          set -euo pipefail
          test -z "${SSH_AUTH_SOCK:-}"
          test "$GIT_SSH_COMMAND" = "false"
          test ! -e "$HOME/.ssh/id_rsa"
          test ! -e "$HOME/.ssh/id_ed25519"
          echo "No agent socket and no usable ssh transport: every fetch below has to go over HTTPS with the App token."

      - name: Clone private infra-base over HTTPS with App credentials only
        run: |
          set -euo pipefail
          clone_dir="$RUNNER_TEMP/probe-infra-base"
          rm -rf "$clone_dir"
          git clone --depth 1 "https://github.com/$PROBE_ORG/infra-base" "$clone_dir"
          test -f "$clone_dir/flake.nix"
          rm -rf "$clone_dir"
          echo "Private infra-base cloned over HTTPS."

      - name: Resolve private nix-shared through its git+ssh flake URL
        run: |
          set -euo pipefail
          # Nix strips the git+ prefix and hands git a plain
          # ssh://git@github.com/… URL, which is the one load-bearing insteadOf
          # form. With no SSH key in the job, resolving this at all proves the
          # rewrite reaches Nix's flake fetcher.
          metadata="$RUNNER_TEMP/probe-nix-shared-metadata.json"
          nix flake metadata --json \
            --extra-experimental-features "nix-command flakes" \
            "git+ssh://git@github.com/$PROBE_ORG/nix-shared" > "$metadata"
          grep -q '"revision"' "$metadata"
          rm -f "$metadata"
          echo "Private nix-shared resolved through its git+ssh:// flake URL."

      - name: Fetch a private Git-LFS-bearing input over the token path
        run: |
          set -euo pipefail
          # Nix implements the Git-LFS protocol itself, so the credential helper
          # and http.extraHeader do not reach it. It reads the remote through
          # libgit2, which applies insteadOf, so this fetch takes the HTTPS
          # branch and authenticates from netrc-file.
          store_path="$(nix eval --impure --raw \
            --extra-experimental-features "nix-command flakes" \
            --expr '(builtins.fetchGit { url = "ssh://git@github.com/'"$PROBE_ORG"'/purescript-dedup"; ref = "main"; lfs = true; }).outPath')"
          listing="$RUNNER_TEMP/probe-lfs-files.txt"
          find "$store_path" -type f -name '*.zstd' | sort > "$listing"
          test -s "$listing"
          lfs_file="$(head -n 1 "$listing")"
          header="$RUNNER_TEMP/probe-lfs-header"
          head -c 100 "$lfs_file" > "$header"
          if grep -q 'git-lfs.github.com/spec/v1' "$header"; then
            echo "::error::$lfs_file is an unsmudged Git-LFS pointer, so the LFS objects were never fetched."
            rm -f "$listing" "$header"
            exit 1
          fi
          rm -f "$listing" "$header"
          echo "Private Git-LFS objects fetched and smudged over the token path."

  # The probe log credential audit — a SEPARATE job, for two reasons that are
  # both fatal to the in-job version this replaces.
  #
  # 1. A job cannot read its own log. GET /actions/jobs/{id}/logs answers 404
  #    for an in-progress job, so the in-job check retried five times over fifty
  #    seconds and then failed closed on every single run — permanently red, and
  #    unable to pass even when all nine substantive steps succeeded. Failing
  #    closed was right; asking a running job for its own log was not.
  # 2. The runner echoes each `run:` body into the log under the "Run" group, so
  #    the scan's own literals — the private-key marker and the token pattern —
  #    would have appeared in the log it read back. The moment the 404 was fixed
  #    the check would have flipped from permanently red to permanently red for
  #    the opposite reason: a guaranteed FALSE-POSITIVE credential leak,
  #    matching its own source. Keeping the scan out of every log it reads is
  #    the only thing that removes that class of defect, and only a separate
  #    job can do it.
  #
  # Because it `needs:` the probes, every audited job has already completed and
  # its log is flushed and retrievable. `always()` keeps the audit running when
  # a probe FAILED — a leak in a failed probe is exactly as serious — while the
  # dispatch gate on the same line keeps it off ordinary pull requests, since
  # `always()` overrides only the implicit needs-succeeded condition, never an
  # explicit `if:` term.
  #
  # It is also strictly wider than the in-job version: it scans the nested jobs
  # of the reusable-workflow probe, which could never have carried a step at
  # all, and it holds no credential of its own beyond the read-only GITHUB_TOKEN
  # it needs to read logs.
  probe-log-credential-audit:
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.run-org-read-probes }}
    needs:
      - probe-reusable-workflow-org-read
      - probe-setup-action-org-read
      - probe-auth-action-self-hosted-org-read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    env:
      PROBE_API_TOKEN: ${{ github.token }}
      # Audits every probe, and deliberately not itself: this job's log is the
      # one log that legitimately contains the patterns below.
      AUDITED_PROBE_JOBS: |
        probe-reusable-workflow-org-read
        probe-setup-action-org-read
        probe-auth-action-self-hosted-org-read
    steps:
      - name: Audit every probe job log for credential material
        run: |
          set -euo pipefail
          # Two failure modes, deliberately worded so a red is never ambiguous:
          #   AUDIT INCOMPLETE, NOT A LEAK — the scan could not run over some
          #     log. Nothing was found and nothing was ruled out.
          #   CREDENTIAL LEAK — a log was read in full and a credential was
          #     found in it.
          # Matches are never echoed, only the name of the job they were found
          # in, so the audit can never become the leak it reports.
          jobs_json="$RUNNER_TEMP/probe-run-jobs.json"
          jobs_status=0
          curl --fail --silent --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $PROBE_API_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" \
            > "$jobs_json" || jobs_status=$?
          if [ "$jobs_status" -ne 0 ]; then
            echo "::error::AUDIT INCOMPLETE, NOT A LEAK: this run's job list could not be read (curl exit $jobs_status), so no probe log was scanned."
            exit 1
          fi
          # One unpaginated page or nothing: a second page would silently leave
          # some probe log unscanned, which is the failure this whole job exists
          # to make impossible.
          total_jobs="$(jq -r '.total_count' "$jobs_json")"
          listed_jobs="$(jq -r '.jobs | length' "$jobs_json")"
          if [ "$total_jobs" -ne "$listed_jobs" ]; then
            echo "::error::AUDIT INCOMPLETE, NOT A LEAK: this run has $total_jobs jobs but only $listed_jobs were returned on one page, so a probe log would go unscanned."
            exit 1
          fi
          leaked=0
          scanned=0
          while IFS= read -r audited_job; do
            if [ -z "$audited_job" ]; then
              continue
            fi
            # A job that calls a reusable workflow contributes no job of its own
            # name; its nested jobs appear as "<caller> / <called>". Matching the
            # name and that prefix covers both shapes.
            matches="$RUNNER_TEMP/probe-audit-matches.tsv"
            jq -r --arg name "$audited_job" \
              '.jobs[] | select(.name == $name or (.name | startswith($name + " / "))) | [(.id | tostring), .status, .name] | @tsv' \
              "$jobs_json" > "$matches"
            if [ ! -s "$matches" ]; then
              echo "::error::AUDIT INCOMPLETE, NOT A LEAK: no job in this run is named '$audited_job' or nested under it, so its log was never scanned. A renamed or removed probe fails the audit rather than emptying it."
              exit 1
            fi
            while IFS=$'\t' read -r job_id job_status job_name; do
              if [ "$job_status" != "completed" ]; then
                echo "::error::AUDIT INCOMPLETE, NOT A LEAK: job '$job_name' is '$job_status' rather than completed, so GitHub need not have flushed its log and it was not scanned."
                exit 1
              fi
              job_log="$RUNNER_TEMP/probe-job-log.txt"
              log_status="never-attempted"
              for attempt in 1 2 3; do
                if log_status="$(curl --silent --show-error --location \
                  --header "Accept: application/vnd.github+json" \
                  --header "Authorization: Bearer $PROBE_API_TOKEN" \
                  --output "$job_log" --write-out '%{http_code}' \
                  "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/jobs/$job_id/logs")"; then
                  if [ "$log_status" = "200" ]; then
                    break
                  fi
                else
                  log_status="curl-transport-failure"
                fi
                echo "Log of completed job '$job_name' not served on attempt $attempt of 3 (result $log_status); GitHub's log store is briefly eventually consistent after a job ends." >&2
                if [ "$attempt" -ne 3 ]; then
                  sleep 5
                fi
              done
              if [ "$log_status" != "200" ]; then
                rm -f "$job_log"
                echo "::error::AUDIT INCOMPLETE, NOT A LEAK: the log of completed job '$job_name' could not be read after 3 attempts (last result $log_status). No credential material was found in it and none was ruled out."
                exit 1
              fi
              if grep -qE '(gh[psu]_|github_pat_)[A-Za-z0-9_]{20,}' "$job_log"; then
                echo "::error::CREDENTIAL LEAK: the log of job '$job_name' was read in full and contains an installation token."
                leaked=1
              fi
              if grep -q 'PRIVATE KEY' "$job_log"; then
                echo "::error::CREDENTIAL LEAK: the log of job '$job_name' was read in full and contains private key material."
                leaked=1
              fi
              rm -f "$job_log"
              scanned=$((scanned + 1))
              echo "Scanned the log of job '$job_name'."
            done < "$matches"
            rm -f "$matches"
          done <<< "$AUDITED_PROBE_JOBS"
          rm -f "$jobs_json"
          if [ "$leaked" -ne 0 ]; then
            exit 1
          fi
          echo "Scanned $scanned probe job logs in full: no installation token and no private key in any of them."
