self-hosted-runner:
  labels:
    # dell-foo. The organization's self-hosted Linux runner label, used by the
    # default runner-map in workflow.yml and by the self-hosted manual probe in
    # validate.yml.
    - x86_64-linux
    # admins-mac-mini. The organization's self-hosted darwin runner label, used
    # by the default runner-map in workflow.yml and by the self-hosted darwin
    # manual probe in validate.yml.
    - macos-arm64-nix-darwin

paths:
  "**/workflow.yml":
    ignore:
      # job.workflow_repository and job.workflow_sha shipped in April 2026 and
      # are not yet part of actionlint's `job` context type.
      - 'property "workflow_(repository|sha)" is not defined in object type'
